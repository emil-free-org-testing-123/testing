# Template for cache-bench.sh: warp-ubuntu-2404-x64-4x and warpcache are substituted per vendor.
# One job: restore a cache, and on a miss generate random data and save it.
# Random data, because zeros compress to nothing.
name: cache-bench-warpcache
on:
  workflow_dispatch:
    inputs:
      size_mb:
        required: true
      round:
        required: true
jobs:
  cache:
    runs-on: warp-ubuntu-2404-x64-4x
    steps:
      - name: restore
        id: restore
        uses: WarpBuilds/cache/restore@v1
        with:
          path: cachedata
          key: bench-warpcache-${{ inputs.size_mb }}-${{ inputs.round }}
      - name: generate
        if: steps.restore.outputs.cache-hit != 'true'
        run: mkdir -p cachedata && head -c ${{ inputs.size_mb }}M /dev/urandom > cachedata/blob
      - name: save
        if: steps.restore.outputs.cache-hit != 'true'
        uses: WarpBuilds/cache/save@v1
        with:
          path: cachedata
          key: bench-warpcache-${{ inputs.size_mb }}-${{ inputs.round }}
      - name: verify
        run: ls -l cachedata
